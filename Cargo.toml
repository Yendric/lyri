[workspace]
members = [
    "apps/lyri-windows",
    "crates/lyri-core",
    "crates/lyri-providers",
    "crates/lyri-server",
]
exclude = ["windows-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
lyri-core = { path = "crates/lyri-core" }
lyri-providers = { path = "crates/lyri-providers" }
tokio = { version = "1", features = ["rt-multi-thread"] }
