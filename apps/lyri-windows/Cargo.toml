[package]
name = "lyri-windows"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lyri-app"
path = "src/main.rs"

[dependencies]
lyri-core.workspace = true
lyri-providers.workspace = true
lyri-server.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Win32_System_WinRT",
] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "c1eb08964de0a563224abb1b148349d0742113c5" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
