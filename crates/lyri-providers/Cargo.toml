[package]
name = "lyri-providers"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
lyri-core = { path = "../lyri-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
urlencoding = "2"

[dev-dependencies]
serde_json = "1"
